<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Sign Up</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    form div { margin-bottom: 12px; }
    input[type=text], input[type=password], input[type=email], select { width: 250px; padding: 5px; }
    #error { color: red; }
    table { border-collapse: collapse; }
    th, td { border: 1px solid black; padding: 6px; }
  </style>
</head>
<body>

  <h1>User Sign Up [Question Number 7]</h1>
  <form id="signupForm">

    <div>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username">
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password">
    </div>

    <div>
      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" name="confirmPassword">
    </div>

    <div>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email">
    </div>

    <!-- radio: many options, only one can be chosen -->
    <div>
      <label>Gender:</label>
      <label><input type="radio" name="gender" value="Male">Male</label>
      <label><input type="radio" name="gender" value="Female">Female</label>
      <label><input type="radio" name="gender" value="Other">Other</label>
    </div>

    <!-- checkbox: many options, several can be chosen -->
    <div>
      <label>Hobbies:</label>
      <label><input type="checkbox" name="hobbies" value="Reading">Reading</label>
      <label><input type="checkbox" name="hobbies" value="Gaming">Gaming</label>
      <label><input type="checkbox" name="hobbies" value="Travelling">Travelling</label>
      <label><input type="checkbox" name="hobbies" value="Painting">Painting</label>
      <label><input type="checkbox" name="hobbies" value="Cafe Hopping">Cafe Hopping</label>
    </div>

    <div>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="">-- Select Country --</option>
        <option value="Nepal">Nepal</option>
        <option value="India">India</option>
        <option value="China">China</option>
        <option value="USA">USA</option>
        <option value="UK">UK</option>
      </select>
    </div>

    <button type="submit">Submit</button>
  </form>

  <!-- hidden until the form is submitted -->
  <div id="result" style="display:none">
    <table>
      <thead>
        <tr><th colspan="2">Submitted Data</th></tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>

<script>
  const form = document.getElementById('signupForm');

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // check passwords first; return stops the function here
    if (form.password.value !== form.confirmPassword.value) {
      alert('Passwords do not match');
      return;
    }

    const gender = form.querySelector('input[name="gender"]:checked');
    const boxes = form.querySelectorAll('input[name="hobbies"]:checked');

    let hobbies = '';
    boxes.forEach(function (box) {
      hobbies += box.value + ' ';
    });

    document.getElementById('resultBody').innerHTML =
      '<tr><th>Username</th><td>' + form.username.value + '</td></tr>' +
      '<tr><th>Email</th><td>' + form.email.value + '</td></tr>' +
      '<tr><th>Gender</th><td>' + (gender ? gender.value : '') + '</td></tr>' +
      '<tr><th>Hobbies</th><td>' + hobbies + '</td></tr>' +
      '<tr><th>Country</th><td>' + form.country.value + '</td></tr>';

    document.getElementById('result').style.display = 'block';
  });
</script>
</body>
</html>
