<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Table</title>
</head>
<body>
  <table border="1" width="500" height="250" cellpadding="8" align="center">
    <tr>
      <td colspan="3" align="center">A</td>
      <td align="center">B</td>
      <td rowspan="3" align="center">C</td>
    </tr>
    <tr>
      <td align="center">D</td>
      <td rowspan="2" align="center">E</td>
      <td align="center">F</td>
      <td align="center">G</td>
    </tr>
    <tr>
      <td rowspan="2" align="center">J</td>
      <td align="center">H</td>
      <td align="center">I</td>
    </tr>
    <tr>
      <td colspan="3" align="center">K</td>
      <td align="center">L</td>
    </tr>
    <tr>
      <td align="center">M</td>
      <td align="center">N</td>
      <td colspan="3" align="center">O</td>
    </tr>
  </table>
</body>
</html>
